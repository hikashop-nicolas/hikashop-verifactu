name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      # The default token is read-only, and publishing the package on the
      # release page needs to write to the repository's contents.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: soap, dom, openssl, mbstring, zip, gd
          tools: composer

      - name: Syntax check the plugin's own code
        run: find verifactu.php src fields media scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build the package
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plg_hikashop_verifactu
          path: build/*.zip

      # A released version: the package is attached to that release and stays.
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip

      # Every commit on main: the package built from it replaces the one on the
      # "latest-build" pre-release, so there is always a download matching the
      # current code without minting a version number for every commit.
      - name: Publish the build of this commit
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build of main
          prerelease: true
          body: |
            Package built automatically from
            [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}),
            ${{ github.event.head_commit.message }}

            This is the current state of the main branch, not a released
            version. Released versions are on the
            [releases page](https://github.com/${{ github.repository }}/releases),
            and their changes are listed in CHANGELOG.md.
          files: build/*.zip
